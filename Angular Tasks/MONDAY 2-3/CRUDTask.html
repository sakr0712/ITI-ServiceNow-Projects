<!doctype html>
<html ng-app="productApp">
  <head>
    <title>CRUD Product Management</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
    />

    <!-- 
    !CSS STYLES
    -->
    <style>
      body {
        background: linear-gradient(135deg, #29292a, #1cc88a);
        font-family: "Segoe UI", sans-serif;
        padding: 30px 0;
      }

      .main-card {
        background: #ffffff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      h2 {
        font-weight: 600;
        margin-bottom: 25px;
      }

      .form-control {
        border-radius: 8px;
        height: 40px;
      }

      .btn-primary-custom {
        background: #4e73df;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 18px;
      }

      .btn-success-custom {
        background: #1cc88a;
        color: white;
        border: none;
        border-radius: 8px;
      }

      .btn-danger-custom {
        background: #e74a3b;
        color: white;
        border: none;
        border-radius: 6px;
      }

      .btn-warning-custom {
        background: #1cc88a;
        color: white;
        border: none;
        border-radius: 6px;
      }

      .table thead {
        background: #4e73df;
        color: white;
      }

      .table tbody tr:hover {
        background-color: #f2f2f2;
      }

      .loading-spinner {
        font-size: 20px;
        color: rgb(0, 0, 0);
        text-align: center;
        margin-top: 20px;
      }

      .error-box {
        margin-top: 15px;
        padding: 10px;
        border-radius: 6px;
        background: #ffe5e5;
        color: #c0392b;
      }

      .card-header {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <!-- 
    !MAIN BODY
    -->
  <body ng-controller="ProductController">
    <div class="container">
      <div class="col-md-10 col-md-offset-1 main-card">
        <h2 class="text-center">Product Management System</h2>

        <!-- FORM -->
        <div class="card-header">
          {{ isEdit ? 'Edit Product' : 'Add New Product' }}
        </div>

        <form
          name="productForm"
          ng-submit="productForm.$valid && (isEdit ? updateProduct() : addProduct())"
          novalidate
        >
          <div class="row">
            <div class="col-md-4 form-group">
              <input
                type="text"
                name="title"
                class="form-control"
                placeholder="Product Title"
                ng-model="newProduct.title"
                required
                minlength="3"
              />
            </div>

            <div class="col-md-4 form-group">
              <input
                type="number"
                name="price"
                class="form-control"
                placeholder="Price"
                ng-model="newProduct.price"
                required
                min="1"
              />
            </div>

            <div class="col-md-4 form-group">
              <input
                type="text"
                name="description"
                class="form-control"
                placeholder="Description"
                ng-model="newProduct.description"
                required
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-success-custom"
            ng-disabled="productForm.$invalid"
          >
            {{ isEdit ? 'Update Product' : 'Add Product' }}
          </button>

          <button
            type="button"
            class="btn btn-primary-custom"
            ng-if="isEdit"
            ng-click="cancelEdit()"
          >
            Cancel
          </button>
        </form>

        <!-- LOADING -->
        <div ng-if="loading" class="loading-spinner">
          ⏳ Loading products...
        </div>

        <!-- ERROR -->
        <div ng-if="errorMessage" class="error-box text-center">
          {{ errorMessage }}
        </div>

        <!-- TABLE -->
        <hr />

        <table class="table table-bordered table-hover" ng-if="!loading">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th width="160">Price</th>
              <th>Description</th>
              <th width="100">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr ng-repeat="product in products">
              <td>{{ $index + 1 }}</td>
              <td>{{ product.title }}</td>
              <td><strong>$ {{ product.price }}</strong></td>
              <td>{{ product.description }}</td>
              <td>
                <button
                  class="btn btn-warning-custom btn-xs"
                  ng-click="editProduct(product)"
                >
                  Edit
                </button>

                <button
                  class="btn btn-danger-custom btn-xs"
                  ng-click="deleteProduct(product.id)"
                >
                  Delete
                </button>
              </td>
            </tr>

            <tr ng-if="products.length === 0">
              <td colspan="5" class="text-center text-muted">
                No products available
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 
    !FUNCTIONALITY SCRIPTS
    -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script>
      angular
        .module("productApp", [])

        .service("ProductService", function ($http) {
          const API_URL =
            "https://69a69040feb94223b31d9d13.mockapi.io/products";

          this.getProducts = function () {
            return $http.get(API_URL);
          };

          this.createProduct = function (product) {
            return $http.post(API_URL, product);
          };

          this.updateProduct = function (product) {
            return $http.put(API_URL + "/" + product.id, product);
          };

          this.deleteProduct = function (id) {
            return $http.delete(API_URL + "/" + id);
          };
        })

        .controller("ProductController", function ($scope, ProductService) {
          $scope.products = [];
          $scope.newProduct = {};
          $scope.isEdit = false;
          $scope.loading = false;
          $scope.errorMessage = "";

          $scope.loadProducts = function () {
            $scope.loading = true;
            $scope.errorMessage = "";

            ProductService.getProducts()
              .then(function (response) {
                $scope.products = response.data;
              })
              .catch(function () {
                $scope.errorMessage = "Error loading products";
              })
              .finally(function () {
                $scope.loading = false;
              });
          };

          $scope.loadProducts();

          $scope.addProduct = function () {
            ProductService.createProduct($scope.newProduct)
              .then(function () {
                $scope.loadProducts();
                $scope.newProduct = {};
              })
              .catch(function () {
                $scope.errorMessage = "Error adding product";
              });
          };

          $scope.editProduct = function (product) {
            $scope.isEdit = true;
            $scope.newProduct = angular.copy(product);
          };

          $scope.updateProduct = function () {
            ProductService.updateProduct($scope.newProduct)
              .then(function () {
                $scope.loadProducts();
                $scope.newProduct = {};
                $scope.isEdit = false;
              })
              .catch(function () {
                $scope.errorMessage = "Error updating product";
              });
          };

          $scope.deleteProduct = function (id) {
            if (!confirm("Confirm deletion...")) return;

            ProductService.deleteProduct(id)
              .then(function () {
                $scope.loadProducts();
              })
              .catch(function () {
                $scope.errorMessage = "Error deleting product";
              });
          };

          $scope.cancelEdit = function () {
            $scope.isEdit = false;
            $scope.newProduct = {};
          };
        });
    </script>
  </body>
</html>
