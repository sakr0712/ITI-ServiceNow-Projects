<!doctype html>
<html lang="en" ng-app="studentApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student List</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- 
    !CSS STYTLES
    -->
    <style>
      body {
        font-family: "Roboto", sans-serif;
        background: #f4f7f9;
        margin: 0;
        padding: 40px 16px;
        color: #333;
      }

      .wrap {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px 24px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 20px;
        text-align: center;
        color: #1a73e8;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
        justify-content: center;
      }

      .controls input,
      .controls select {
        padding: 8px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
        min-width: 200px;
      }

      .controls input:focus,
      .controls select:focus {
        border-color: #1a73e8;
        box-shadow: 0 0 4px rgba(26, 115, 232, 0.4);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 12px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      th,
      td {
        padding: 12px 16px;
        text-align: center;
        font-size: 15px;
      }

      thead {
        background-color: #1a73e8;
        color: #fff;
      }

      tbody tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      .topper {
        color: #0a9e00;
        font-weight: 700;
      }

      .low {
        color: #d32f2f;
        font-weight: 700;
      }

      .empty {
        text-align: center;
        font-style: italic;
        color: #777;
        padding: 10px;
        border: 1px dashed #ccc;
        border-radius: 6px;
        margin-top: 10px;
        background: #fefefe;
      }

      @media (max-width: 600px) {
        .controls {
          flex-direction: column;
          align-items: stretch;
        }
        .controls input,
        .controls select {
          width: 100%;
        }
      }
    </style>
  </head>

  <!-- 
    !MAIN BODY
    -->
  <body>
    <div class="wrap" ng-controller="mainCtrl">
      <student-list students="students"></student-list>
    </div>

    <!-- 
    !FUNCTIONALITY SCRIPTS
    -->
    <script>
      var app = angular.module("studentApp", []);

      app.controller("mainCtrl", function ($scope) {
        $scope.students = [
          { name: "SEIF", marks: 90 },
          { name: "ZIAD", marks: 60 },
          { name: "AHMED", marks: 30 },
          { name: "KAREEM", marks: 10 },
          { name: "MOHAMED", marks: 100 },
        ];
      });

      app.directive("studentList", function () {
        return {
          scope: { students: "=" },
          template: `
          <h1>Student List</h1>

          <div class="controls">
            <input type="text" placeholder="Search by name..." ng-model="q" />
            <select ng-model="sortOpt" ng-change="applySort()">
              <option value="name">Sort by Name</option>
              <option value="marksDesc">Sort by Marks (High to Low)</option>
              <option value="marksAsc">Sort by Marks (Low to High)</option>
            </select>
          </div>

          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Marks</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="s in filtered = (students | filter:byName | orderBy:orderExpr:reverse) track by $index">
                <td>{{$index + 1}}</td>
                <td ng-class="{'low': s.marks < 40, 'topper': s.marks > 80}">{{s.name}}</td>
                <td ng-class="{'low': s.marks < 40, 'topper': s.marks > 80}">{{s.marks}}</td>
              </tr>
            </tbody>
          </table>

          <div class="empty" ng-if="filtered.length === 0">
            No student found
          </div>
        `,
          link: function (scope) {
            scope.q = "";
            scope.sortOpt = "name";
            scope.orderExpr = "name";
            scope.reverse = false;

            scope.byName = function (s) {
              var q = (scope.q || "").toLowerCase().trim();
              if (!q) return true;
              return (s.name || "").toLowerCase().includes(q);
            };

            scope.applySort = function () {
              if (scope.sortOpt === "marksDesc") {
                scope.orderExpr = "marks";
                scope.reverse = true;
              } else if (scope.sortOpt === "marksAsc") {
                scope.orderExpr = "marks";
                scope.reverse = false;
              } else {
                scope.orderExpr = "name";
                scope.reverse = false;
              }
            };
          },
        };
      });
    </script>
  </body>
</html>
