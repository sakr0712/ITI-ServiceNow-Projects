<!doctype html>
<html ng-app="myApp">
  <head>
    <!-- !HEADER -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single Page Application</title>
    <!-- *BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- *CSS -->
    <link rel="stylesheet" href="styles.css" />
    <!-- *ANGULAR -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-route/1.8.3/angular-route.min.js"></script>
    <!-- ?BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- *MAIN SCRIPT -->
    <script src="app.js"></script>
    <!-- <script src="services/homeService.js"></script> -->
    <script src="controller/homeCtrl.js"></script>
    <script src="services/productService.js"></script>
    <script src="controller/productCtrl.js"></script>
  </head>

  <!-- !BODY -->
  <body>
    <!--*===================== NAVBAR =====================-->
    <nav
      class="navbar navbar-expand-lg custom-navbar"
      ng-controller="NavController"
    >
      <div class="container">
        <!-- brand with logo -->
        <a class="navbar-brand d-flex align-items-center" href="#!/home">
          <span class="navbar-logo">🌐</span>
          <span class="brand-text">My SPA</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link"
                ng-class="{ active: isActive('/home') }"
                href="#!/home"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                ng-class="{ active: isActive('/about') }"
                href="#!/about"
                >About</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                ng-class="{ active: isActive('/products') }"
                href="#!/products"
                >Products</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                ng-class="{ active: isActive('/gallery') }"
                href="#!/gallery"
                >Gallery</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                ng-class="{ active: isActive('/contact') }"
                href="#!/contact"
                >Contact</a
              >
            </li>
          </ul>

          <form class="d-flex align-items-center ms-lg-4" role="search">
            <input
              class="form-control me-2 search-input"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>
    <!--*===================== DYNAMIC CONTENT =====================-->
    <div ng-view></div>
  </body>
</html>
